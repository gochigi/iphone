<title>iPhone</title>
<meta name="description" content="카카오톡 장문 아카이브 — 아이폰 화면">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#e9e8ee; --fg:#2a2836; --muted:#77738a; --shadow:rgba(40,36,90,.35);
  --frame-a:#9aa0f0; --frame-b:#5055c2; --bezel:#0a0a0c;
  --ios-bg:#f2f2f7; --ios-card:#fff; --ios-text:#000; --ios-sub:#8a8a8e; --ios-sep:#c6c6c8; --ios-blue:#007aff; --ios-red:#ff3b30; --ios-green:#34c759;
  --tk-yellow:#fae500; --tk-brown:#3c1e1e; --tk-room:#d1dbe2; --tk-sep:#ececec; --tk-gray:#b4b8bc; --tk-badge:#ff4b3e; --tk-av:#c9d2da; --tk-pill:#f2f2f4; --tk-card:#f4f4f6;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light; --top:54px; --bot:22px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111118; --fg:#e8e6f2; --muted:#9a96ad; --shadow:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#111118; --fg:#e8e6f2; --muted:#9a96ad; --shadow:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sys);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0}
input,textarea{font:inherit}
#screen{color-scheme:light}
#screen input,#screen textarea{color:#000;color-scheme:light;caret-color:#000}
#screen input::placeholder,#screen textarea::placeholder{color:#a0a0a5}
svg{display:block}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#device{position:absolute;left:50%;top:calc(50% - 16px);width:419px;height:878px;padding:3px;border-radius:70px;
  background:linear-gradient(150deg,var(--frame-a),var(--frame-b) 55%,var(--frame-a));
  box-shadow:0 50px 90px -30px var(--shadow),0 0 0 1px rgba(255,255,255,.25) inset;transform:translate(-50%,-50%)}
#bezel{width:100%;height:100%;padding:10px;border-radius:67px;background:var(--bezel)}
.hw{position:absolute;width:4px;background:linear-gradient(90deg,var(--frame-b),var(--frame-a));border-radius:2px}
.hw.l{left:-3px}.hw.r{right:-3px}.hw.act{top:150px;height:34px}.hw.vu{top:208px;height:62px}.hw.vd{top:282px;height:62px}.hw.pw{top:232px;height:100px;cursor:pointer;width:5px}
#hint{position:absolute;left:0;right:0;bottom:10px;margin:0;text-align:center;font-size:13px;color:var(--muted);padding:0 16px}
#screen{position:relative;width:393px;height:852px;border-radius:57px;overflow:hidden;isolation:isolate;background:#000;
  font-family:var(--sys);font-size:17px;color:var(--ios-text);-webkit-user-select:none;user-select:none;letter-spacing:-.2px}
#island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:60}
html.m #device{left:0;top:0;width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
html.m #bezel{padding:0;border-radius:0}
html.m #screen{width:100%;height:100%;border-radius:0}
html.m .hw,html.m #hint,html.m #island,html.m #statusbar,html.m .homebar{display:none}
html.m{--top:env(safe-area-inset-top,0px);--bot:max(env(safe-area-inset-bottom,0px),20px)}
html.m #screen{background:#fff}

.wall{position:absolute;inset:0;z-index:0;background:
  radial-gradient(70% 45% at 20% 8%,#b9d4ff 0%,rgba(185,212,255,0) 60%),
  radial-gradient(60% 40% at 88% 30%,#7ee3ef 0%,rgba(126,227,239,0) 60%),
  radial-gradient(80% 50% at 60% 62%,#4d6fe8 0%,rgba(77,111,232,0) 65%),
  radial-gradient(90% 55% at 30% 100%,#6a3fd9 0%,rgba(106,63,217,0) 65%),
  linear-gradient(180deg,#5f93ea 0%,#3b63cf 40%,#26307f 78%,#171a4a 100%)}
#statusbar{position:absolute;top:0;left:0;right:0;height:54px;padding:0 28px 0 40px;display:flex;align-items:center;justify-content:space-between;
  font-weight:600;font-size:17px;color:#fff;z-index:50;pointer-events:none;font-variant-numeric:tabular-nums}
#statusbar .l{width:70px;text-align:center}
#statusbar .r{display:flex;gap:7px;align-items:center}
#screen[data-bar="dark"] #statusbar{color:#000}
.batt{width:27px;height:13px;border:1.5px solid currentColor;border-radius:4.5px;padding:2px;position:relative;opacity:.95}
.batt::after{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0;opacity:.5}
.batt i{display:block;height:100%;width:85%;background:currentColor;border-radius:2px}

.layer{position:absolute;inset:0;display:none;flex-direction:column}
.layer.on{display:flex}

/* ---------- 잠금화면 ---------- */
#lock{z-index:20;display:flex;align-items:center;color:#fff;transition:transform .45s cubic-bezier(.3,.75,.2,1);touch-action:none}
#lock .wall{z-index:-1}
#lock.up{transform:translateY(-104%)}
#lock.drag{transition:none}
.lk-icon{margin-top:calc(var(--top) + 22px);opacity:.95}
.lk-date{margin-top:8px;font-size:22px;font-weight:500;letter-spacing:-.3px;text-shadow:0 1px 10px rgba(0,0,0,.18)}
.lk-time{font-size:98px;font-weight:700;line-height:1.02;letter-spacing:-2px;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.15)}
.lk-ntf{margin-top:auto;width:100%;padding:0 10px;display:flex;flex-direction:column;gap:8px}
.ntf{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:start;text-align:left;width:100%;padding:12px 14px;border-radius:24px;
  background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);color:#111}
.ntf .ic{width:38px;height:38px;border-radius:9px;overflow:hidden}
.ntf b{display:block;font-size:15px;font-weight:600}
.ntf span{display:block;font-size:15px;color:#222;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ntf em{font-style:normal;font-size:12px;color:#444;align-self:start}
.lk-tools{display:flex;justify-content:space-between;width:100%;padding:34px 48px calc(var(--bot) + 12px)}
.lk-tools button{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;color:#fff}
.homebar{width:140px;height:5px;border-radius:3px;background:#fff;margin:26px auto 9px;opacity:.95}
.homebar.dark{background:#000}
#pad{z-index:30;align-items:center;color:#fff;background:rgba(10,16,50,.6);-webkit-backdrop-filter:blur(40px) saturate(1.5);backdrop-filter:blur(40px) saturate(1.5)}
#pad h2{margin:calc(var(--top) + 72px) 0 18px;font-size:20px;font-weight:500}
.dots{display:flex;gap:18px;height:16px;margin-bottom:40px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.dots i.f{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px}
.keys button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);font-size:34px;font-weight:400;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys button small{font-size:10px;letter-spacing:2px;font-weight:700;margin-top:2px}
.keys button:active{background:rgba(255,255,255,.5)}
.pad-foot{display:flex;justify-content:space-between;width:276px;margin-top:24px;font-size:17px}
.pad-foot button{min-width:60px;text-align:left}.pad-foot button:last-child{text-align:right}
#pad .sub{font-size:14px;opacity:.8;margin:-8px 0 16px}
#pad .txt{display:none;width:276px;margin-bottom:26px}#pad .txt input{width:100%;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:18px;text-align:center;outline:none;caret-color:#fff}
#pad.text .txt{display:block}#pad.text .dots,#pad.text .keys{display:none}
#pad.shake .dots{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}

/* ---------- 홈 ---------- */
#home{z-index:10;padding:0 22px}
#home .wall{z-index:-1}
.apps{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;gap:24px 0;margin-top:calc(var(--top) + 30px)}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11px;font-weight:500;letter-spacing:-.1px;text-shadow:0 1px 3px rgba(0,0,0,.4);width:60px}
.app .ic{width:60px;height:60px;border-radius:13.5px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.app .ic svg,.app .ic img{width:60px;height:60px;display:block;border-radius:13.5px}
.app .badge{position:absolute;top:-6px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ios-red);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;text-shadow:none;border:2px solid rgba(0,0,0,.08)}
.app:active .ic{filter:brightness(.75)}
.app span{white-space:nowrap}
.search-pill{margin:auto auto 12px;background:rgba(255,255,255,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;padding:7px 14px;color:#fff;font-size:13px;display:flex;align-items:center;gap:6px;align-self:center}
.dock{margin:0 -6px 12px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:36px;padding:13px 16px;display:flex;justify-content:space-between}
.dock .app{gap:0}.dock .app span{display:none}
.pagedots{display:flex;justify-content:center;gap:9px;padding:4px 0 calc(var(--bot) - 12px)}
.pagedots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}.pagedots i:first-child{background:#fff}

/* ---------- 앱 공통 ---------- */
.appv{z-index:15;background:#fff}
.hdr{height:calc(var(--top) + 44px);padding:var(--top) 8px 0;display:flex;align-items:center;gap:2px;background:#fff;flex:none}
.hdr .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr button{width:40px;height:44px;display:grid;place-items:center;color:#000}
.hdr .sp{width:40px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}

<script>
/* ============ 0. 원본 보존 / 상태 ============ */
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const LS_KEY='kakao_archive_v1', CFG_KEY='kakao_archive_cfg';
const DEF={v:2,me:'',minLen:200,pass:'',showRoom:true,updated:0,msgs:[],del:{},rev:{}};
let FILE_DATA=DEF,DATA_ERR=null; try{FILE_DATA=Object.assign({},DEF,JSON.parse(document.getElementById('archive-data').textContent))}catch(e){DATA_ERR=e}
let S=FILE_DATA;
try{const ls=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(ls&&ls.updated>FILE_DATA.updated) S=Object.assign({},DEF,ls)}catch(e){}
let CFG={gist:'',token:'',pass:'',last:0}; try{Object.assign(CFG,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'))}catch(e){}
(function(){const m=location.hash.match(/[#&]g=([0-9a-f]{6,})/i); if(m&&m[1]!==CFG.gist){CFG.gist=m[1];CFG.pass='';S=Object.assign({},DEF);saveCfg()}})();
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG))}catch(e){}}
function persist(){S.updated=Date.now();persistLocal()}
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){} refreshCounts()}
const shared=()=>!!CFG.gist, canWrite=()=>!shared()||!!CFG.token;
function unsaved(){return !shared()&&S.updated>FILE_DATA.updated}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function msgId(m){return hash(m.d+'|'+m.t+'|'+m.x)}
function sortMsgs(){S.msgs.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t))}
function isDel(id){return ((S.del||{})[id]||0)>((S.rev||{})[id]||0)}
function mergeMsgs(list,revive){if(!S.del)S.del={};if(!S.rev)S.rev={};const have=new Set(S.msgs.map(msgId));let add=0;(list||[]).forEach(m=>{if(!m||!m.x||!m.d)return;const o={d:m.d,t:m.t||'00:00',x:m.x,r:m.r||''};const id=msgId(o);if(isDel(id)){if(revive)S.rev[id]=Math.max(Date.now(),(S.del[id]||0)+1);else return}if(!have.has(id)){have.add(id);S.msgs.push(o);add++}});sortMsgs();return add}
function removeMsgs(list){if(!S.del)S.del={};const ids=new Set(list.map(msgId));ids.forEach(id=>S.del[id]=Math.max(Date.now(),((S.rev||{})[id]||0)+1));S.msgs=S.msgs.filter(m=>!ids.has(msgId(m)))}
function mergeMarks(remote){if(!S.del)S.del={};if(!S.rev)S.rev={};['del','rev'].forEach(k=>{const r=remote[k]||{};for(const id in r){if(!S[k][id]||r[id]>S[k][id])S[k][id]=r[id]}});S.msgs=S.msgs.filter(m=>!isDel(msgId(m)))}

/* ============ 1. 카카오톡 내보내기 파서 ============ */
const KO_MON={};['January','February','March','April','May','June','July','August','September','October','November','December'].forEach((m,i)=>KO_MON[m]=i+1);
function to24(ap,h,mi){ap=ap||'';h=+h;if(/오후|PM/i.test(ap)&&h<12)h+=12;if(/오전|AM/i.test(ap)&&h===12)h=0;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function ymd(y,m,d){return y+'-'+String(+m).padStart(2,'0')+'-'+String(+d).padStart(2,'0')}
const RX={
  header:/^(.+?)(님과|와|과|\(.*\)) 카카오톡 대화\s*$|^KakaoTalk Chats? with (.+)$/,
  saved:/^(저장한 날짜|Date Saved)\s*:/,
  sysPC:/^(.+?)(님이 (나갔습니다|들어왔습니다)|님을 초대했습니다|님이 채팅방을 나갔습니다)\.?\s*$/,
  dateSepPC:/^-+\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일.*?-+\s*$/,
  dateIOS:/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*[월화수목금토일]요일\s*$/,
  dateAnd:/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*(오전|오후)?\s*(\d{1,2}):(\d{2})\s*$/,
  dateEn:/^([A-Z][a-z]+) (\d{1,2}), (\d{4}),? (\d{1,2}):(\d{2}) (AM|PM)\s*$/,
  msgPC:/^\[([^\]]+)\]\s*\[(오전|오후)?\s*(\d{1,2}):(\d{2})\]\s?(.*)$/,
  msgAnd:/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*(오전|오후)?\s*(\d{1,2}):(\d{2}),\s*(.+?)\s*:\s(.*)$/,
  msgIOS:/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.?\s*(오전|오후)?\s*(\d{1,2}):(\d{2}),\s*(.+?)\s*:\s(.*)$/,
  msgEn:/^([A-Z][a-z]+) (\d{1,2}), (\d{4}),? (\d{1,2}):(\d{2}) (AM|PM),\s*(.+?)\s:\s(.*)$/,
  msgCSV:/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::\d{2})?,"?([^",]*?)"?,"?([\s\S]*)$/,
  msgISO:/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::\d{2})?,\s*(.+?)\s:\s(.*)$/
};
function parseKakao(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const lines=text.split('\n'); const out=[]; let room='',cur=null,date='',fmt='',unknown=0,i=0;
  const push=()=>{if(cur){cur.x=cur.x.replace(/\s+$/,'');if(cur.x)out.push(cur);cur=null}};
  for(;i<lines.length;i++){
    const ln=lines[i]; let m;
    if(i<4&&(m=RX.header.exec(ln))){room=(m[1]||m[3]||'').trim();continue}
    if(i<6&&RX.saved.test(ln))continue;
    if((m=RX.dateSepPC.exec(ln))||(m=RX.dateIOS.exec(ln))){push();date=ymd(m[1],m[2],m[3]);fmt=fmt||(m[0].startsWith('-')?'pc':'ios');continue}
    if((m=RX.msgPC.exec(ln))){push();cur={d:date,t:to24(m[2],m[3],m[4]),s:m[1].trim(),x:m[5],r:room};fmt='pc';continue}
    if((m=RX.msgAnd.exec(ln))){push();cur={d:ymd(m[1],m[2],m[3]),t:to24(m[4],m[5],m[6]),s:m[7].trim(),x:m[8],r:room};fmt='android';continue}
    if((m=RX.msgIOS.exec(ln))){push();cur={d:ymd(m[1],m[2],m[3]),t:to24(m[4],m[5],m[6]),s:m[7].trim(),x:m[8],r:room};fmt='ios';continue}
    if((m=RX.msgEn.exec(ln))){push();cur={d:ymd(m[3],KO_MON[m[1]]||1,m[2]),t:to24(m[6],m[4],m[5]),s:m[7].trim(),x:m[8],r:room};fmt='android-en';continue}
    if((m=RX.msgISO.exec(ln))){push();cur={d:ymd(m[1],m[2],m[3]),t:m[4]+':'+m[5],s:m[6].trim(),x:m[7],r:room};fmt='iso';continue}
    if((m=RX.msgCSV.exec(ln))&&!/^Date,User/i.test(ln)){push();cur={d:ymd(m[1],m[2],m[3]),t:m[4]+':'+m[5],s:m[6].trim(),x:m[7].replace(/"$/,'').replace(/""/g,'"'),r:room};fmt='csv';continue}
    if(/^Date,User,Message/i.test(ln)){continue}
    if((m=RX.dateAnd.exec(ln))||(m=RX.dateEn.exec(ln))){push();continue}
    if(!cur&&RX.sysPC.test(ln)){continue}
    if(cur){cur.x+='\n'+ln}else if(ln.trim()){unknown++}
  }
  push(); return {room,fmt:fmt||'unknown',msgs:out,unknown};
}

/* ============ 2. 암호화 + Gist 동기화 ============ */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encode(obj,pass){const json=JSON.stringify(obj);if(!pass)return json;const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(json));return 'ENC1:'+b64(salt)+':'+b64(iv)+':'+b64(ct)}
async function decode(content,pass){content=content.trim();if(!content.startsWith('ENC1:'))return JSON.parse(content);if(!pass)throw {code:'NEEDPASS'};const [,s,i,c]=content.split(':');try{const key=await deriveKey(pass,unb64(s));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(i)},key,unb64(c));return JSON.parse(td.decode(pt))}catch(e){throw {code:'BADPASS'}}}
const API='https://api.github.com/gists';let ETAG='',SYNC={state:'idle',msg:'',at:0};
function ghHeaders(json){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(CFG.token)h['Authorization']='Bearer '+CFG.token;if(json)h['Content-Type']='application/json';return h}
function payload(){sortMsgs();return {v:2,me:S.me,minLen:S.minLen,pass:S.pass,showRoom:S.showRoom,updated:S.updated,msgs:S.msgs,del:S.del||{},rev:S.rev||{}}}
let pull=async function(force){
  if(!shared())return {st:'local'};
  const h=ghHeaders();if(ETAG&&!force)h['If-None-Match']=ETAG;let r;
  try{r=await fetch(API+'/'+CFG.gist,{headers:h,cache:'no-store'})}catch(e){SYNC={state:'offline',msg:'인터넷 연결 없음',at:Date.now()};return {st:'offline'}}
  if(r.status===304){SYNC={state:'ok',msg:'최신 상태',at:Date.now()};return {st:'same'}}
  if(r.status===404){SYNC={state:'err',msg:'링크의 저장소를 찾을 수 없어요',at:Date.now()};return {st:'notfound'}}
  if(r.status===403||r.status===429){SYNC={state:'err',msg:'잠시 후 다시 시도해 주세요(요청 한도)',at:Date.now()};return {st:'ratelimit'}}
  if(!r.ok){SYNC={state:'err',msg:'오류 '+r.status,at:Date.now()};return {st:'error'}}
  ETAG=r.headers.get('ETag')||'';const j=await r.json();const f=j.files&&j.files['archive.json'];if(!f){SYNC={state:'err',msg:'archive.json 없음',at:Date.now()};return {st:'nofile'}}
  let content=f.content;if(f.truncated){content=await (await fetch(f.raw_url,{cache:'no-store'})).text()}
  let data;try{data=await decode(content,CFG.pass)}catch(e){SYNC={state:'locked',msg:e.code==='BADPASS'?'암호가 틀렸어요':'암호가 필요해요',at:Date.now()};return {st:e.code||'badpass'}}
  mergeMarks(data);const add=mergeMsgs(data.msgs);if(data.me)S.me=data.me;if(data.pass!==undefined)S.pass=data.pass;if(data.minLen)S.minLen=data.minLen;if(data.showRoom!==undefined)S.showRoom=data.showRoom;S.updated=Math.max(S.updated||0,data.updated||0);
  persistLocal();SYNC={state:'ok',msg:'최신 상태',at:Date.now()};CFG.last=Date.now();saveCfg();return {st:'ok',add}

let push=async function(){
  if(!shared())return false;if(!CFG.token)throw {code:'NOTOKEN'};
  const content=await encode(payload(),CFG.pass);
  const r=await fetch(API+'/'+CFG.gist,{method:'PATCH',headers:ghHeaders(true),body:JSON.stringify({files:{'archive.json':{content}}})});
  if(r.status===401||r.status===403)throw {code:'BADTOKEN'};if(r.status===404)throw {code:'NOTFOUND'};if(!r.ok)throw {code:'HTTP'+r.status};
  ETAG=r.headers.get('ETag')||'';SYNC={state:'ok',msg:'업로드 완료',at:Date.now()};CFG.last=Date.now();saveCfg();return true
}
async function createGist(){const content=await encode(payload(),CFG.pass);const r=await fetch(API,{method:'POST',headers:ghHeaders(true),body:JSON.stringify({description:'iPhone archive (private)',public:false,files:{'archive.json':{content}}})});if(r.status===401||r.status===403)throw {code:'BADTOKEN'};if(!r.ok)throw {code:'HTTP'+r.status};const j=await r.json();return j.id}

async function syncUp(afterMsg){ /* 변경 후: 최신 받아 합치고 올리기 */
  if(!shared()){persist();if(afterMsg)toast(afterMsg);return}
  if(!CFG.token){persist();toast('읽기 전용 링크예요. 설정에서 토큰을 넣어야 올릴 수 있어요');return}
  if(syncing)return;syncing=true;try{S.updated=Date.now();persistLocal();const r=await pull(true);if(!(r.st==='ok'||r.st==='same')){toast(r.st==='BADPASS'||r.st==='NEEDPASS'?'아카이브 암호가 맞지 않아 올리지 않았어요. 이 기기에는 저장됐어요':'서버에서 받지 못해 올리지 않았어요(이 기기에는 저장됨). 잠시 후 다시 시도해 주세요');SYNC={state:'err',msg:'올리기 보류',at:Date.now()};return}S.updated=Date.now();await push();persistLocal();if(afterMsg)toast(afterMsg)}
  catch(e){const c=e&&e.code;toast(c==='BADTOKEN'?'토큰이 잘못됐거나 gist 권한이 없어요':c==='NOTFOUND'?'링크의 저장소를 찾을 수 없어요':'업로드 실패. 잠시 후 다시 시도해 주세요');SYNC={state:'err',msg:'업로드 실패',at:Date.now()}}

}

const lock=$('#lock');let ly=null;

  else{CFG.pass='';saveCfg();$('#pad-title').textContent=r.st==='BADPASS'||r.st==='NEEDPASS'?'암호가 틀렸어요':'연결 실패 · 다시 시도';padFail();setTimeout(()=>{$('#pad-title').textContent='아카이브 암호 입력'},1500)}}

    let grid='';for(let i=0;i<first;i++)grid+='<i></i>';for(let d=1;d<=n;d++){const k=JY+'-'+JM+'-'+String(d).padStart(2,'0');grid+=`<button data-k="${k}" ${days[k]?'class="has"':'disabled'}>${d}${days[k]?`<small>${days[k]}</small>`:''}</button>`}

function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function buildHtml(){sortMsgs();S.updated=S.updated||Date.now();const json=JSON.stringify(S).replace(/</g,'\\u003c');

async function readText(f){const buf=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder('euc-kr').decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}}
async function handleFiles(fl){const files=[...fl];if(!files.length)return;IMP={files:[],senders:{}};
  for(const f of files){const t=await readText(f);const res=parseKakao(t);res.head=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()).slice(0,3).map(l=>l.slice(0,70));IMP.files.push({name:f.name,res});res.msgs.forEach(m=>{IMP.senders[m.s]=(IMP.senders[m.s]||0)+1;IMP.longest=IMP.longest||{};IMP.longest[m.s]=Math.max(IMP.longest[m.s]||0,m.x.trim().length)})}renderPick()}
function candidates(who,min){const out=[];IMP.files.forEach(f=>f.res.msgs.forEach(m=>{if(m.s===who&&m.x.trim().length>=min)out.push({d:m.d,t:m.t,x:m.x.trim(),r:m.r})}));return out}

  ${names.length?names.map(n=>`<label class="opt"><input type="radio" name="who" value="${esc(n)}" ${n===pre?'checked':''}><b>${esc(n)}</b><span>${IMP.senders[n].toLocaleString()}개 · 가장 긴 글 ${(IMP.longest[n]||0).toLocaleString()}자</span></label>`).join(''):'<div class="rep">메시지를 하나도 못 읽었어요. 카카오톡 "대화 내용 내보내기" 원본 txt인지 확인해 주세요.</div>'}

  const preview=()=>{const who=(document.querySelector('input[name=who]:checked')||{}).value;const min=Math.max(1,+$('#imp-min').value||1);const c=candidates(who,min).length;$('#imp-preview').textContent=c?`${c.toLocaleString()}개 선택됨`:`0개 · 기준을 ${(IMP.longest[who]||0)}자 이하로 낮춰 보세요`};

  $('#imp-go').onclick=async()=>{const who=(document.querySelector('input[name=who]:checked')||{}).value;if(!who)return;const min=Math.max(1,+$('#imp-min').value||1);const cand=candidates(who,min);

    await syncUp();if(!shared()&&add)setTimeout(async()=>{const v=await alertBox({title:'파일로 저장',msg:'지금 파일로 저장할까요? 저장해야 다른 곳에서 열어도 보여요.',buttons:[{label:'나중에'},{label:'저장',bold:true,value:'ok'}]});if(v.btn==='ok')saveHtml()},800)}}
